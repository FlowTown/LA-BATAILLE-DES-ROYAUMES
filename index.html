<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Master Score</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#111;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.card{background:#1d1d1d;padding:28px;border-radius:14px;width:380px;box-shadow:0 0 20px rgba(0,0,0,.4)}
input,select,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;box-sizing:border-box}
button{background:#d6b16a;font-weight:bold;cursor:pointer}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
#panel{display:none}
#msg{margin-top:10px;color:#7dff9a;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<div id="loginBox">
<h2>Master Score</h2>
<input id="login" placeholder="Identifiant">
<input id="password" type="password" placeholder="Mot de passe">
<button onclick="login()">Connexion</button>
</div>

<div id="panel">
<h2>Master Score</h2>

<select id="kingdomSelect"></select>

<p>Score actuel : <strong id="currentScore">0</strong></p>

<div class="row">
<button onclick="addPoints(100)">+100</button>
<button onclick="addPoints(1000)">+1000</button>
<button onclick="addPoints(10000)">+10000</button>
</div>

<input id="customPoints" type="number" placeholder="Valeur personnalisée">
<button onclick="addCustom()">Ajouter</button>

<p id="msg"></p>
</div>
</div>

<script>
const SUPABASE_URL="https://vajvtuxjefyktalirqcf.supabase.co";
const SUPABASE_KEY="sb_publishable_aG99lJA0pJtRgUKbP7GRBw_Xz-Mj6C_";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const ADMIN_ID="Dieudesages";
const ADMIN_PASSWORD="Tadé172107";

let kingdoms=[];

function login(){
 if(login.value===ADMIN_ID && password.value===ADMIN_PASSWORD){
   loginBox.style.display="none";
   panel.style.display="block";
   loadKingdoms();
 }else alert("Identifiants incorrects");
}

async function loadKingdoms(){
 const {data,error}=await supabaseClient.from("kingdoms").select("id,name,score");
 if(error){alert(error.message);console.error(error);return;}
 kingdoms=data.sort((a,b)=>a.id-b.id);
 kingdomSelect.innerHTML="";
 kingdoms.forEach(k=>{
   kingdomSelect.innerHTML+=`<option value="${k.id}">${k.name}</option>`;
 });
 kingdomSelect.onchange=updateScore;
 updateScore();
}

function updateScore(){
 const id=parseInt(kingdomSelect.value);
 const k=kingdoms.find(x=>x.id===id);
 if(!k)return;
 currentScore.textContent=k.score.toLocaleString("fr-FR")+" points";
}

async function addPoints(value){
 const id=parseInt(kingdomSelect.value);
 const k=kingdoms.find(x=>x.id===id);
 if(!k)return;

 const newScore=k.score+value;

 const {error}=await supabaseClient
 .from("kingdoms")
 .update({score:newScore})
 .eq("id",id);

 if(error){alert(error.message);return;}

 k.score=newScore;
 updateScore();
 msg.textContent=`+${value} points ajoutés à ${k.name}`;
}

function addCustom(){
 const value=parseInt(customPoints.value);
 if(!value||value===0){alert("Entre une valeur");return;}
 addPoints(value);
 customPoints.value="";
}
</script>
</body>
</html>
