<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master Score</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#111;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:400px;
    background:#1d1d1d;
    padding:30px;
    border-radius:12px;
    box-shadow:0 0 20px rgba(0,0,0,.4);
}

h1{
    text-align:center;
    margin-bottom:25px;
}

input,select{
    width:100%;
    padding:12px;
    margin:10px 0 20px;
    border:none;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    background:#d4af37;
    color:black;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

#panel{
    display:none;
}

.score{
    font-size:22px;
    font-weight:bold;
    text-align:center;
    margin:20px 0;
}

#message{
    text-align:center;
    margin-top:20px;
    color:#64ff64;
}
</style>

</head>
<body>

<div class="container">

    <div id="loginBox">

        <h1>Master Score</h1>

        <input
            id="login"
            placeholder="Identifiant">

        <input
            id="password"
            type="password"
            placeholder="Mot de passe">

        <button onclick="connexion()">
            Connexion
        </button>

    </div>

    <div id="panel">

        <h1>Master Score</h1>

        <label>Royaume</label>

        <select id="kingdomSelect"></select>

        <div class="score" id="currentScore">
            Chargement...
        </div>

      <button onclick="addPoints(100)">+100</button>
<button onclick="addPoints(1000)">+1000</button>
<button onclick="addPoints(10000)">+10000</button>

<input
    id="customPoints"
    type="number"
    placeholder="Valeur personnalisée">

<button onclick="addCustomPoints()">
    Ajouter
</button>
        </button>

        <p id="message"></p>

    </div>

</div>

<script>

const SUPABASE_URL = "https://vajvtuxjefyktalirqcf.supabase.co";
const SUPABASE_KEY = "sb_publishable_aG99lJA0pJtRgUKbP7GRBw_Xz-Mj6C_";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

// Ton identifiant
const ADMIN_ID = "Dieudesages";

// Ton mot de passe
const ADMIN_PASSWORD = "Tadé172107";

let kingdoms = [];

function connexion(){

    const id = document.getElementById("login").value;
    const mdp = document.getElementById("password").value;

    if(id===ADMIN_ID && mdp===ADMIN_PASSWORD){

        document.getElementById("loginBox").style.display="none";
        document.getElementById("panel").style.display="block";

        loadKingdoms();

    }else{

        alert("Identifiants incorrects");

    }

}

async function loadKingdoms(){

    const { data, error } = await supabaseClient
        .from("kingdoms")
        .select("*")
        .order("id");

    if(error){

        console.error(error);
        alert("Erreur Supabase");

        return;

    }

    kingdoms = data;

    const select = document.getElementById("kingdomSelect");

    select.innerHTML = "";

    kingdoms.forEach(k=>{

        const option=document.createElement("option");

        option.value=k.id;
        option.textContent=k.name;

        select.appendChild(option);

    });

    select.addEventListener("change",updateCurrentScore);

    updateCurrentScore();

}

function updateCurrentScore(){

    const id=Number(document.getElementById("kingdomSelect").value);

    const kingdom=kingdoms.find(k=>k.id===id);

    if(!kingdom)return;

    document.getElementById("currentScore").innerHTML=
        kingdom.score.toLocaleString("fr-FR")+" points";

}
async function addPoints(points){

    const id = Number(document.getElementById("kingdomSelect").value);

    const kingdom = kingdoms.find(k => k.id === id);

    if(!kingdom) return;

    const nouveauScore = kingdom.score + points;

    const { error } = await supabaseClient
        .from("kingdoms")
        .update({
            score: nouveauScore
        })
        .eq("id", id);

    const message = document.getElementById("message");

    if(error){

        console.error(error);

        message.style.color = "#ff6666";
        message.innerHTML = "❌ " + error.message;

        return;

    }

    kingdom.score = nouveauScore;

    updateCurrentScore();

    message.style.color = "#64ff64";
    message.innerHTML = "✅ +" + points + " points ajoutés à <b>" + kingdom.name + "</b>";

}

function addCustomPoints(){

    const points = Number(document.getElementById("customPoints").value);

    if(!points){

        alert("Entre une valeur");

        return;

    }

    addPoints(points);

    document.getElementById("customPoints").value = "";

}
</script>

</body>
</html>
