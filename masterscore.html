    *{box-sizing:border-box}

        radial-gradient(1.5px 1.5px at 84% 85%, rgba(255,255,255,.45) 40%, transparent 45%);
    }

    body::after{
      opacity:.18;
      background:
        radial-gradient(circle at 20% 40%, rgba(255,255,255,.08), transparent 20%),
        radial-gradient(circle at 80% 60%, rgba(255,255,255,.06), transparent 18%);
      filter:blur(40px);
    }

    img{display:block;max-width:100%}
    a{text-decoration:none;color:inherit}

      width:min(1280px, calc(100% - 28px));
      margin:0 auto;
      position:relative;
      z-index:1;
    }

      z-index:30;

      border-bottom:1px solid rgba(255,255,255,.05);
    }
