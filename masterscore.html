<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Master Score — Administration</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }

    .card {
      background: #1d1d1d;
      padding: 28px;
      border-radius: 14px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 0 20px rgba(0, 0, 0, .4);
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      border: none;
      box-sizing: border-box;
      font-size: 16px;
    }

    input, select {
      background: #fff;
      color: #111;
    }

    button {
      background: #d6b16a;
      color: #111;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #e8c67f;
    }

    button:disabled {
      cursor: wait;
      opacity: .65;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .row button {
      font-size: 14px;
    }

    #panel {
      display: none;
    }

    #msg {
      min-height: 22px;
      margin: 12px 0 0;
      color: #7dff9a;
      font-weight: bold;
      text-align: center;
    }

    #msg.error {
      color: #ff8d8d;
    }

    .logout {
      background: #666;
      color: white;
      margin-top: 18px;
    }
  </style>
</head>

<body>
  <main class="card">
    <section id="loginBox">
      <h1>Master Score</h1>

      <form id="loginForm">
        <input
          id="loginInput"
          type="text"
          placeholder="Identifiant"
          autocomplete="username"
          required
        >

        <input
          id="passwordInput"
          type="password"
          placeholder="Mot de passe"
          autocomplete="current-password"
          required
        >

        <button type="submit">Connexion</button>
      </form>
    </section>

    <section id="panel">
      <h1>Master Score</h1>

      <select id="kingdomSelect" aria-label="Choisir un royaume"></select>

      <p>
        Score actuel :
        <strong id="currentScore">0 point</strong>
      </p>

      <div class="row">
        <button type="button" data-points="100">+100</button>
        <button type="button" data-points="1000">+1 000</button>
        <button type="button" data-points="10000">+10 000</button>
      </div>

      <form id="customForm">
        <input
          id="customPoints"
          type="number"
          step="1"
          placeholder="Valeur personnalisée"
          required
        >

        <button type="submit">Ajouter les points</button>
      </form>

      <button id="logoutButton" class="logout" type="button">
        Déconnexion
      </button>
    </section>

    <p id="msg"></p>
  </main>

  <script>
    const SUPABASE_URL = "https://vajvtuxjefyktalirqcf.supabase.co";
    const SUPABASE_KEY = "sb_publishable_aG99lJA0pJtRgUKbP7GRBw_Xz-Mj6C_";

    const ADMIN_ID = "Dieudesages";
    const ADMIN_PASSWORD = "TON_MOT_DE_PASSE_ADMIN";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const loginBox = document.querySelector("#loginBox");
    const panel = document.querySelector("#panel");
    const loginForm = document.querySelector("#loginForm");
    const loginInput = document.querySelector("#loginInput");
    const passwordInput = document.querySelector("#passwordInput");

    const kingdomSelect = document.querySelector("#kingdomSelect");
    const currentScore = document.querySelector("#currentScore");
    const customForm = document.querySelector("#customForm");
    const customPoints = document.querySelector("#customPoints");
    const logoutButton = document.querySelector("#logoutButton");
    const msg = document.querySelector("#msg");
    const pointsButtons = document.querySelectorAll("[data-points]");

    let kingdoms = [];

    function afficherMessage(texte = "", erreur = false) {
      msg.textContent = texte;
      msg.classList.toggle("error", erreur);
    }

    function bloquerBoutons(bloque) {
      document.querySelectorAll("button").forEach(button => {
        button.disabled = bloque;
      });
    }

    function afficherScore() {
      const kingdom = kingdoms.find(
        kingdom => String(kingdom.id) === kingdomSelect.value
      );

      if (!kingdom) {
        currentScore.textContent = "0 point";
        return;
      }

      currentScore.textContent =
        `${Number(kingdom.score).toLocaleString("fr-FR")} points`;
    }

    async function chargerRoyaumes() {
      const { data, error } = await supabaseClient
        .from("kingdoms")
        .select("id, name, score")
        .order("id");

      if (error) {
        throw error;
      }

      kingdoms = data || [];
      kingdomSelect.replaceChildren();

      kingdoms.forEach(kingdom => {
        const option = document.createElement("option");
        option.value = kingdom.id;
        option.textContent = kingdom.name;
        kingdomSelect.appendChild(option);
      });

      afficherScore();
    }

    async function ajouterPoints(valeur) {
      const id = kingdomSelect.value;
      const kingdom = kingdoms.find(
        item => String(item.id) === id
      );

      if (!kingdom) {
        afficherMessage("Choisis un royaume.", true);
        return;
      }

      const points = Number(valeur);

      if (!Number.isInteger(points) || points === 0) {
        afficherMessage("Entre un nombre entier non nul.", true);
        return;
      }

      const nouveauScore = Number(kingdom.score) + points;

      bloquerBoutons(true);
      afficherMessage();

      const { error } = await supabaseClient
        .from("kingdoms")
        .update({ score: nouveauScore })
        .eq("id", kingdom.id);

      bloquerBoutons(false);

      if (error) {
        afficherMessage(`Erreur : ${error.message}`, true);
        return;
      }

      kingdom.score = nouveauScore;
      afficherScore();

      afficherMessage(
        `${points > 0 ? "+" : ""}${points.toLocaleString("fr-FR")} points ajoutés à ${kingdom.name}`
      );
    }

    loginForm.addEventListener("submit", async event => {
      event.preventDefault();

      if (
        loginInput.value.trim() !== ADMIN_ID ||
        passwordInput.value !== ADMIN_PASSWORD
      ) {
        afficherMessage("Identifiants incorrects.", true);
        return;
      }

      loginBox.style.display = "none";
      panel.style.display = "block";
      passwordInput.value = "";

      bloquerBoutons(true);

      try {
        await chargerRoyaumes();
        afficherMessage(
          kingdoms.length
            ? "Administration prête."
            : "Aucun royaume trouvé."
        );
      } catch (error) {
        afficherMessage(`Erreur Supabase : ${error.message}`, true);
      } finally {
        bloquerBoutons(false);
      }
    });

    kingdomSelect.addEventListener("change", afficherScore);

    pointsButtons.forEach(button => {
      button.addEventListener("click", () => {
        ajouterPoints(button.dataset.points);
      });
    });

    customForm.addEventListener("submit", event => {
      event.preventDefault();

      const valeur = customPoints.value;
      customPoints.value = "";

      ajouterPoints(valeur);
    });

    logoutButton.addEventListener("click", () => {
      panel.style.display = "none";
      loginBox.style.display = "block";
      loginInput.value = "";
      passwordInput.value = "";
      afficherMessage();
    });
  </script>
</body>
</html>
